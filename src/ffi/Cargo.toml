[package]
name = "nethermind-lean"
version = "0.16.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[lib]
name = "nethermind_lean"
crate-type = ["cdylib", "rlib"]

[dependencies]
# dlopen cannot place jemalloc's default initial-exec TLS in a host process such as dotnet.
tikv-jemallocator = { version = "0.7", features = ["disable_initial_exec_tls"] }
rec_aggregation.workspace = true
rec_aggregation_base.workspace = true
signatures.workspace = true
primitives.workspace = true
parallel.workspace = true
bench.workspace = true
lean_compiler.workspace = true
leanvm_core.workspace = true
fiat_shamir.workspace = true

[dev-dependencies]
verifier.workspace = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"

# Unmodified leanEthereum/leanVM, pinned. crates/rec_aggregation is vendored from the same revision and carries the
# EIP-8288 guest; crates/signatures supplies NiceTry v2 as lean_sphincs.
[workspace.dependencies]
primitives = { git = "https://github.com/leanEthereum/leanVM", rev = "e4dcb8d5436c9bf76398d890c57c59613af12956" }
fiat_shamir = { git = "https://github.com/leanEthereum/leanVM", rev = "e4dcb8d5436c9bf76398d890c57c59613af12956" }
pcs = { git = "https://github.com/leanEthereum/leanVM", rev = "e4dcb8d5436c9bf76398d890c57c59613af12956" }
keccak_gkr = { git = "https://github.com/leanEthereum/leanVM", rev = "e4dcb8d5436c9bf76398d890c57c59613af12956" }
leanvm_core = { git = "https://github.com/leanEthereum/leanVM", rev = "e4dcb8d5436c9bf76398d890c57c59613af12956" }
lean_compiler = { git = "https://github.com/leanEthereum/leanVM", rev = "e4dcb8d5436c9bf76398d890c57c59613af12956" }
bench = { git = "https://github.com/leanEthereum/leanVM", rev = "e4dcb8d5436c9bf76398d890c57c59613af12956" }
lean_da = { git = "https://github.com/leanEthereum/leanVM", rev = "e4dcb8d5436c9bf76398d890c57c59613af12956" }
parallel = { git = "https://github.com/leanEthereum/leanVM", rev = "e4dcb8d5436c9bf76398d890c57c59613af12956" }
verifier = { git = "https://github.com/leanEthereum/leanVM", rev = "e4dcb8d5436c9bf76398d890c57c59613af12956" }
upstream_signatures = { package = "signatures", git = "https://github.com/leanEthereum/leanVM", rev = "e4dcb8d5436c9bf76398d890c57c59613af12956" }
rec_aggregation = { path = "crates/rec_aggregation" }
# EIP-8288's guest exactly as the base package ships it, for guest 0 (see src/base.rs).
rec_aggregation_base = { path = "crates/rec_aggregation_base" }
signatures = { path = "crates/signatures" }
rand = "0.9"
tracing = "0.1.26"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[example]]
name = "lean_startup_stub"
crate-type = ["cdylib"]
test = false

# TODO: the committed bytecode key needs leanVM core changes that are not upstream yet. They live on
# Marchhill/leanVM feature/eip8288-bytecode-commitment, four commits on the pinned e4dcb8d5. Upstream them (or move
# them into this repository) and drop this patch before merging.
[patch."https://github.com/leanEthereum/leanVM"]
primitives = { git = "https://github.com/Marchhill/leanVM", rev = "2ce918752cbdcf3c341da70f532e8523f89d402b" }
