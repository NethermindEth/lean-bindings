[package]
name = "nethermind-lean"
version = "0.20.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[lib]
name = "nethermind_lean"
crate-type = ["cdylib", "rlib"]

[dependencies]
# dlopen cannot place jemalloc's default initial-exec TLS in a host process such as dotnet.
tikv-jemallocator = { version = "0.7", features = ["disable_initial_exec_tls"] }
rec_aggregation.workspace = true
lean_sphincs.workspace = true
primitives.workspace = true
parallel.workspace = true
bench.workspace = true
lean_compiler.workspace = true
leanvm_core.workspace = true
fiat_shamir.workspace = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"

# Unmodified leanEthereum/leanVM, pinned. crates/rec_aggregation is vendored from the same revision and carries the
# EIP-8288 guest; crates/lean_sphincs is NiceTry v2 in place of upstream's leanSPHINCS.
[workspace.dependencies]
primitives = { git = "https://github.com/leanEthereum/leanVM", rev = "f7ba4999ae523b94c8d0969b32762c3effea4cbd" }
fiat_shamir = { git = "https://github.com/leanEthereum/leanVM", rev = "f7ba4999ae523b94c8d0969b32762c3effea4cbd" }
pcs = { git = "https://github.com/leanEthereum/leanVM", rev = "f7ba4999ae523b94c8d0969b32762c3effea4cbd" }
keccak_gkr = { git = "https://github.com/leanEthereum/leanVM", rev = "f7ba4999ae523b94c8d0969b32762c3effea4cbd" }
leanvm_core = { git = "https://github.com/leanEthereum/leanVM", rev = "f7ba4999ae523b94c8d0969b32762c3effea4cbd" }
lean_compiler = { git = "https://github.com/leanEthereum/leanVM", rev = "f7ba4999ae523b94c8d0969b32762c3effea4cbd" }
bench = { git = "https://github.com/leanEthereum/leanVM", rev = "f7ba4999ae523b94c8d0969b32762c3effea4cbd" }
lean_da = { git = "https://github.com/leanEthereum/leanVM", rev = "f7ba4999ae523b94c8d0969b32762c3effea4cbd" }
parallel = { git = "https://github.com/leanEthereum/leanVM", rev = "f7ba4999ae523b94c8d0969b32762c3effea4cbd" }
verifier = { git = "https://github.com/leanEthereum/leanVM", rev = "f7ba4999ae523b94c8d0969b32762c3effea4cbd" }
lean_xmss = { git = "https://github.com/leanEthereum/leanVM", rev = "f7ba4999ae523b94c8d0969b32762c3effea4cbd" }
rec_aggregation = { path = "crates/rec_aggregation" }
lean_sphincs = { path = "crates/lean_sphincs" }
rand = "0.9"
tracing = "0.1.26"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[example]]
name = "lean_startup_stub"
crate-type = ["cdylib"]
test = false
