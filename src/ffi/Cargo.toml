[package]
name = "nethermind-lean"
version = "0.21.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[lib]
name = "nethermind_lean"
crate-type = ["cdylib", "rlib"]

[dependencies]
# dlopen cannot place jemalloc's default initial-exec TLS in a host process such as dotnet.
tikv-jemallocator = { version = "0.7", features = ["disable_initial_exec_tls"] }
aggregation.workspace = true
lean_sphincs.workspace = true
isa.workspace = true
verifier.workspace = true
keccak256.workspace = true
parallel.workspace = true
bench.workspace = true
zkdsl_compiler.workspace = true
lean_vm_core.workspace = true
experimental_lean_vm_core = { git = "https://github.com/leanEthereum/leanVM", rev = "f37c5e5e74ac718ab188653d5a0175bfdad25b06" }
fiat_shamir_prover.workspace = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"

# Unmodified leanEthereum/leanVM, pinned, on its stable prover. crates/aggregation is vendored from the same revision
# and carries the EIP-8288 guest (guests/lean_ethereum.py).
[workspace.dependencies]
isa = { git = "https://github.com/leanEthereum/leanVM", rev = "f37c5e5e74ac718ab188653d5a0175bfdad25b06" }
verifier = { git = "https://github.com/leanEthereum/leanVM", rev = "f37c5e5e74ac718ab188653d5a0175bfdad25b06" }
keccak256 = { git = "https://github.com/leanEthereum/leanVM", rev = "f37c5e5e74ac718ab188653d5a0175bfdad25b06" }
fiat_shamir_prover = { git = "https://github.com/leanEthereum/leanVM", rev = "f37c5e5e74ac718ab188653d5a0175bfdad25b06" }
zkdsl_compiler = { git = "https://github.com/leanEthereum/leanVM", rev = "f37c5e5e74ac718ab188653d5a0175bfdad25b06" }
lean_xmss = { git = "https://github.com/leanEthereum/leanVM", rev = "f37c5e5e74ac718ab188653d5a0175bfdad25b06" }
lean_sphincs = { git = "https://github.com/leanEthereum/leanVM", rev = "f37c5e5e74ac718ab188653d5a0175bfdad25b06" }
lean_da = { git = "https://github.com/leanEthereum/leanVM", rev = "f37c5e5e74ac718ab188653d5a0175bfdad25b06" }
bench = { git = "https://github.com/leanEthereum/leanVM", rev = "f37c5e5e74ac718ab188653d5a0175bfdad25b06" }
lean_vm_core = { package = "stable_lean_vm_core", git = "https://github.com/leanEthereum/leanVM", rev = "f37c5e5e74ac718ab188653d5a0175bfdad25b06" }
pcs = { package = "stable_pcs", git = "https://github.com/leanEthereum/leanVM", rev = "f37c5e5e74ac718ab188653d5a0175bfdad25b06" }
primitives = { package = "stable_primitives", git = "https://github.com/leanEthereum/leanVM", rev = "f37c5e5e74ac718ab188653d5a0175bfdad25b06" }
parallel = { package = "stable_parallel", git = "https://github.com/leanEthereum/leanVM", rev = "f37c5e5e74ac718ab188653d5a0175bfdad25b06" }
aggregation = { path = "crates/aggregation" }
rand = "0.9"
tracing = "0.1.26"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[example]]
name = "lean_startup_stub"
crate-type = ["cdylib"]
test = false
