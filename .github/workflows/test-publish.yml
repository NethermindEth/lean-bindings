name: Test / Publish

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to NuGet
        default: 'No'
        type: choice
        options:
          - 'No'
          - Staging
          - Production
      build-run:
        description: Build Lean run ID whose binaries to publish to staging instead of the committed ones
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-formatting:
    name: Verify formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Verify formatting
        run: dotnet format whitespace src/bindings --folder --verify-no-changes

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.build-run == '' }}

      # The binaries a staging publish takes from a Build Lean run are the ones tested; Publish checks the run.
      - name: Remove the committed outputs
        if: inputs.build-run != ''
        run: rm -rf src/bindings/Nethermind.Crypto.Lean/runtimes src/bindings/Nethermind.Crypto.Lean/testing

      - name: Download the libraries
        if: inputs.build-run != ''
        uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          merge-multiple: true
          path: src/bindings/Nethermind.Crypto.Lean/runtimes
          run-id: ${{ inputs.build-run }}
          github-token: ${{ github.token }}

      - name: Download the test assets
        if: inputs.build-run != ''
        uses: actions/download-artifact@v8
        with:
          pattern: testing-linux-*
          merge-multiple: true
          path: src/bindings/Nethermind.Crypto.Lean/testing
          run-id: ${{ inputs.build-run }}
          github-token: ${{ github.token }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Install dependencies
        working-directory: src/bindings
        run: dotnet restore Nethermind.Crypto.Lean.Tests

      - name: Test
        working-directory: src/bindings/Nethermind.Crypto.Lean.Tests
        run: dotnet test -c release --no-restore

  rust-test:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      LEANVM_NUM_THREADS: 1
      # rustdoc ignores the rustflags in src/ffi/.cargo/config.toml; without carry-less multiply, the crate refuses to build.
      RUSTDOCFLAGS: -C target-cpu=native
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The largest proving test needs more memory than a hosted runner has; without swap, the runner is killed.
      - name: Add swap
        run: |
          dir=/mnt
          sudo test -d "$dir" || dir=/
          available=$(df -BG --output=avail "$dir" | tail -1 | tr -dc 0-9)
          size=$(( available > 24 ? 16 : available - 8 ))
          [ "$size" -ge 4 ] || { echo "::error::Only ${available}G free on $dir"; exit 1; }
          sudo fallocate -l "${size}G" "$dir/lean.swap"
          sudo chmod 600 "$dir/lean.swap"
          sudo mkswap "$dir/lean.swap"
          sudo swapon "$dir/lean.swap"
          swapon --show
          free -h

      # rust-toolchain.toml pins the toolchain, which rustup installs on first use.
      - name: Test
        working-directory: src/ffi
        run: cargo test --release --locked --workspace -- --test-threads=1

  verify-package:
    name: Verify package assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      # A consumer publishing for a RID must get that RID's library beside its binary, and nothing else.
      - name: Pack and publish a consumer per RID
        run: |
          dotnet pack src/bindings/Nethermind.Crypto.Lean -c release -p:Version=0.0.0.1 -o "$RUNNER_TEMP/feed"
          consumer="$RUNNER_TEMP/consumer"
          dotnet new console -o "$consumer"
          dotnet add "$consumer" package Nethermind.Crypto.Lean --version 0.0.0.1 --source "$RUNNER_TEMP/feed"
          for rid in linux-x64:X86-64 linux-arm64:AArch64; do
            out="$RUNNER_TEMP/out-${rid%%:*}"
            dotnet publish "$consumer" -c release -r "${rid%%:*}" --self-contained false -o "$out"
            readelf -h "$out/libnethermind_lean.so" | grep -q "Machine:.*${rid##*:}"
            test ! -e "$out/runtimes"
            # The test assets reach only a consumer that opts in.
            test ! -e "$out/lean-vectors" && test ! -e "$out/testing" && test ! -e "$out/fixtures"
          done

  publish:
    name: Publish
    needs: [verify-formatting, test, rust-test, verify-package]
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'No' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      NUGET_URL: ${{ inputs.publish == 'Staging' && 'https://int.nugettest.org' || 'https://www.nuget.org' }}
      NUGET_SOURCE: ${{ inputs.publish == 'Staging' && 'https://apiint.nugettest.org' || 'https://api.nuget.org' }}/v3/index.json

    steps:
      # NuGet.org takes only the committed binaries; a branch's build goes to staging only, from that exact commit.
      - name: Check the Build Lean run
        if: inputs.build-run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build-run }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ $PUBLISH == Staging ]] || fail "A Build Lean run publishes to staging only, not $PUBLISH"
          [[ $GITHUB_REF == refs/heads/* && $GITHUB_REF != refs/heads/main ]] || fail "A Build Lean run publishes only from a branch other than main, not $GITHUB_REF"
          [[ $BUILD_RUN =~ ^[0-9]+$ ]] || fail "Invalid run ID '$BUILD_RUN'"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" \
            --jq '[.repository.full_name, .path, .conclusion, .head_sha] | @tsv')
          IFS=$'\t' read -r repo path conclusion sha <<< "$run"
          [[ $repo == "$GITHUB_REPOSITORY" && $path == .github/workflows/build-lean.yml ]] || fail "Run $BUILD_RUN is $repo/$path, not Build Lean"
          [[ $conclusion == success ]] || fail "Run $BUILD_RUN concluded '$conclusion', not success"
          [[ $sha == "$GITHUB_SHA" ]] || fail "Run $BUILD_RUN built $sha, not $GITHUB_SHA"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.build-run == '' }}

      - name: Remove the committed outputs
        if: inputs.build-run != ''
        run: rm -rf src/bindings/Nethermind.Crypto.Lean/runtimes src/bindings/Nethermind.Crypto.Lean/testing THIRD-PARTY-NOTICES

      - name: Download the libraries
        if: inputs.build-run != ''
        uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          merge-multiple: true
          path: src/bindings/Nethermind.Crypto.Lean/runtimes
          run-id: ${{ inputs.build-run }}
          github-token: ${{ github.token }}

      - name: Download the test assets
        if: inputs.build-run != ''
        uses: actions/download-artifact@v8
        with:
          pattern: testing-linux-*
          merge-multiple: true
          path: src/bindings/Nethermind.Crypto.Lean/testing
          run-id: ${{ inputs.build-run }}
          github-token: ${{ github.token }}

      - name: Download the notices
        if: inputs.build-run != ''
        uses: actions/download-artifact@v8
        with:
          name: notices
          run-id: ${{ inputs.build-run }}
          github-token: ${{ github.token }}

      # A Build Lean run takes the crate version with the branch as a pre-release, e.g. 0.12.0-my-branch(.<run number>).
      - name: Detect version
        id: version
        working-directory: src/bindings
        env:
          BUILD_RUN: ${{ inputs.build-run }}
        run: |
          version_prefix=$(sed -n 's|.*<VersionPrefix>\(.*\)</VersionPrefix>.*|\1|p' Directory.Build.props)
          version_suffix=$(sed -n 's|.*<VersionSuffix>\(.*\)</VersionSuffix>.*|\1|p' Directory.Build.props)
          if [[ -n $BUILD_RUN ]]; then
            crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' ../ffi/Cargo.toml | head -1)
            [[ $crate =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Unexpected crate version '$crate'"; exit 1; }
            branch=$(tr '[:upper:]' '[:lower:]' <<< "$GITHUB_REF_NAME" | sed -e 's/[^0-9a-z-]/-/g' -e 's/--*/-/g' | cut -c1-40 | sed 's/^-*//; s/-*$//')
            # A numeric pre-release identifier must not have leading zeros; a prefix makes any slug alphanumeric.
            [[ $branch =~ ^[0-9]*$ ]] && branch=branch${branch:+-$branch}
            version_prefix=${crate%%-*}
            version_suffix=$([[ $crate == *-* ]] && echo "${crate#*-}." || true)$branch
          fi
          version=$version_prefix${version_suffix:+-$version_suffix}
          echo "Detected version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing \`Nethermind.Crypto.Lean\` \`$version.$GITHUB_RUN_NUMBER\` to $NUGET_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: NuGet login
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          audience: ${{ env.NUGET_URL }}
          token-service-url: ${{ env.NUGET_URL }}/api/v2/token

      - name: Publish
        working-directory: src/bindings
        run: |
          dotnet pack ./Nethermind.Crypto.Lean -c release \
            -p:Version=${{ steps.version.outputs.version }}.${{ github.run_number }}
          dotnet nuget push ./artifacts/package/release/*.nupkg \
            -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s ${{ env.NUGET_SOURCE }}
